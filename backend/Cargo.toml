[package]
name = "mcp-hub"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.34"
hkdf = "0.13.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
toml = "1.2.0"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "stream", "query"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

# Built by `cargo test`, never part of a release build.
[[example]]
name = "fake_mcp"
path = "tests/fixtures/fake_mcp/main.rs"
