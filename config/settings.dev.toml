# Local development settings, used by `cargo dev` in backend/.

[server]
signup = "enabled"

[paths]
catalog  = "../config/catalog.example.toml"
packages = "../.dev/packages"
scratch  = "/tmp/mcp-hub-dev/scratch"
static   = "../frontend/build"

[runtimes]
bun  = "/usr/bin/bun"
node = "/usr/bin/node"
uv   = "/usr/bin/uv"
